<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini IVR Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #eef2f5; color: #17212b; }
    main { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    section { background: white; border: 1px solid #d9e0e6; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px #17212b12; }
    header { padding: 22px 24px; background: #123b4a; color: white; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; color: #d8edf2; }
    #messages { min-height: 360px; max-height: 55vh; overflow-y: auto; padding: 20px; }
    .message { margin: 10px 0; padding: 11px 14px; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; }
    .user { margin-right: 15%; background: #d9edf0; }
    .model { margin-left: 15%; background: #f0f3f5; }
    .composer { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #d9e0e6; }
    textarea { flex: 1; resize: vertical; min-height: 48px; padding: 10px; border: 1px solid #b7c3cc; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; background: #0e7485; color: white; }
    button.secondary { background: #64727d; }
    .actions { display: flex; gap: 8px; padding: 0 16px 16px; }
    .status { padding: 0 20px 12px; color: #64727d; font-size: 14px; }
    .concepts { border-top: 1px solid #d9e0e6; padding: 16px; }
    .concepts form, .concept-row { display: flex; gap: 8px; margin-top: 8px; }
    .concepts input { flex: 1; padding: 10px; border: 1px solid #b7c3cc; border-radius: 6px; font: inherit; }
    .concept-row { align-items: center; justify-content: space-between; }
    .concept-row button { padding: 6px 10px; }
  </style>
</head>
<body>
  <main>
    <section>
      <header>
        <h1>דמו לשיחה עם Gemini</h1>
        <p>אותו שרשור שיחה, בלי חיוג ובלי יצירת קובץ שמע.</p>
      </header>
      <div id="messages" aria-live="polite"></div>
      <div class="status" id="status"></div>
      <form class="composer" id="form">
        <textarea id="message" placeholder="כתבו הודעה ולחצו Enter..." required></textarea>
        <button type="submit">שליחה</button>
      </form>
      <div class="actions">
        <select id="roleSelect">
          <option value="public">משתמש ציבורי</option>
          <option value="trainer">מאמן</option>
        </select>
        <button class="secondary" id="reset" type="button">שיחה חדשה</button>
        <button class="secondary" id="speak" type="button">השמע תשובה אחרונה</button>
      </div>
      <div class="concepts">
        <strong>מושגים</strong>
        <form id="conceptForm">
          <input id="conceptInput" placeholder="מושג" required>
          <input id="definitionInput" placeholder="פירוש המושג" required>
          <button type="submit">הצעת מושג</button>
        </form>
        <div id="pendingConcepts"></div>
      </div>
    </section>
  </main>
  <script>
    const conversationId = crypto.randomUUID();
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');
    const input = document.getElementById('message');
    const roleSelect = document.getElementById('roleSelect');
    const conceptForm = document.getElementById('conceptForm');
    const conceptInput = document.getElementById('conceptInput');
    const definitionInput = document.getElementById('definitionInput');
    const pendingConcepts = document.getElementById('pendingConcepts');
    let lastAnswer = '';

    async function refreshPendingConcepts() {
      if (roleSelect.value !== 'trainer') {
        pendingConcepts.replaceChildren();
        return;
      }
      const response = await fetch('/demo/concepts/pending');
      const data = await response.json();
      pendingConcepts.replaceChildren();
      data.concepts.forEach((concept) => {
        const row = document.createElement('div');
        row.className = 'concept-row';
        row.innerHTML = `<span><strong>${concept.term}</strong>: ${concept.definition}</span>`;
        const approve = document.createElement('button');
        approve.textContent = 'אישור';
        approve.onclick = () => reviewConcept(concept.id, 'approve');
        const remove = document.createElement('button');
        remove.textContent = 'מחיקה';
        remove.onclick = () => reviewConcept(concept.id, 'delete');
        row.append(approve, remove);
        pendingConcepts.appendChild(row);
      });
    }

    async function reviewConcept(id, action) {
      await fetch('/demo/concepts/review', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id, action})
      });
      refreshPendingConcepts();
    }

    roleSelect.addEventListener('change', refreshPendingConcepts);
    conceptForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const endpoint = roleSelect.value === 'trainer' ? '/demo/concepts/add' : '/demo/concepts/suggest';
      const response = await fetch(endpoint, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({term: conceptInput.value, definition: definitionInput.value})
      });
      const data = await response.json();
      status.textContent = response.ok
        ? (roleSelect.value === 'trainer' ? 'המושג נוסף ואושר.' : 'המושג נשלח לאישור המאמן.')
        : data.error;
      conceptInput.value = '';
      definitionInput.value = '';
      refreshPendingConcepts();
    });

    function addMessage(text, role) {
      const element = document.createElement('div');
      element.className = `message ${role}`;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      addMessage(message, 'user');
      status.textContent = 'ממתין לתשובה...';
      try {
        const response = await fetch('/demo/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            message,
            conversation_id: conversationId,
            role: roleSelect.value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'שגיאה');
        lastAnswer = data.answer;
        addMessage(lastAnswer, 'model');
        status.textContent = '';
      } catch (error) {
        status.textContent = `שגיאה: ${error.message}`;
      }
    });

    document.getElementById('reset').addEventListener('click', async () => {
      await fetch('/demo/reset', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          conversation_id: conversationId,
          role: roleSelect.value
        })
      });
      messages.replaceChildren();
      lastAnswer = '';
      status.textContent = 'נפתחה שיחה חדשה';
    });

    document.getElementById('speak').addEventListener('click', () => {
      if (lastAnswer && 'speechSynthesis' in window) {
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(lastAnswer));
      }
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.getElementById('form').requestSubmit();
      }
    });
  </script>
</body>
</html>
