services:
  - type: web
    name: gemini-ivr
    runtime: python
    rootDir: .
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30
    healthCheckPath: /refresh
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: APP_VERSION
        value: 2026-09-15-gemini-text-parser-fix
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_WEBHOOK_SECRET
        sync: false
      - key: TRAINER_WEBHOOK_SECRET
        sync: false
